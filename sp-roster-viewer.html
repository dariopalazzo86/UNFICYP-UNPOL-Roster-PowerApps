<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="UNPOL Roster">
<meta name="theme-color" content="#f5f7fa">
<title>UNPOL Roster — Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fa;--bg2:#fff;--bg3:#eef1f6;
  --border:#dde2ec;--border2:#c8d0e0;
  --text:#1a1f36;--text2:#4a5170;--text3:#8890aa;
  --accent:#3b5bdb;--accent2:#2f4ac7;
  --r:7px;--rl:11px;
  --ui:'Inter',sans-serif;--mono:'DM Mono',monospace;
  --sh:0 1px 4px rgba(0,0,0,.08);
  --d-bg:#dbeafe;--d-t:#1e40af;--d-b:#93c5fd;
  --a-bg:#dcfce7;--a-t:#166534;--a-b:#86efac;
  --rd-bg:#fef9c3;--rd-t:#854d0e;--rd-b:#fde047;
  --al-bg:#fce7f3;--al-t:#9d174d;--al-b:#f9a8d4;
  --of-bg:#f8fafc;--of-t:#94a3b8;--of-b:#e2e8f0;
  --we:#f1f5f9;
  --sbg:#ede9fe;--st:#5b21b6;--sb:#c4b5fd;
  --stbg:#e0f2fe;--stt:#075985;--stb:#7dd3fc;
  --ubg:#fef3c7;--ut:#92400e;--ub:#fcd34d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--ui)}
body{display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:11px 20px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:60;box-shadow:var(--sh);flex-wrap:wrap}
.logo{font-size:16px;font-weight:700;color:var(--accent);letter-spacing:-.3px}
.sub{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:1px}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rbadge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;letter-spacing:.5px;background:#16a34a;color:#fff}
.upd{font-size:11px;font-family:var(--mono);color:var(--text3);display:flex;align-items:center;gap:5px}
.udot{width:7px;height:7px;border-radius:50%;background:#16a34a;flex-shrink:0}
main{flex:1;padding:14px 20px;overflow:visible}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:11px;padding:9px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--sh)}
.ccard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:14px;box-shadow:var(--sh)}
input[type=text],input[type=date],select{font-size:12px;font-family:var(--ui);padding:5px 8px;border-radius:var(--r);border:1px solid var(--border2);background:#fff;color:var(--text);outline:none;transition:border-color .15s}
input[type=text]:focus,input[type=date]:focus,select:focus{border-color:var(--accent)}
input::placeholder{color:var(--text3)}
label{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px}
.btn{font-size:12px;font-family:var(--ui);font-weight:600;padding:5px 11px;border-radius:var(--r);border:1px solid var(--border2);background:#fff;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .12s}
.btn:hover{background:var(--bg3);color:var(--text)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.acc:hover{background:var(--accent2)}
.btn.sm{font-size:11px;padding:3px 8px}
.mybanner{display:none;margin-bottom:10px;padding:10px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--rl);font-size:12px;color:var(--text2);gap:10px;align-items:center;flex-wrap:wrap}
.mybanner.show{display:flex}
.stats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;align-items:center}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;box-shadow:var(--sh);display:flex;align-items:center;gap:5px;white-space:nowrap}
.slbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.sval{font-size:13px;font-weight:700;font-family:var(--mono)}
.legend{display:flex;gap:10px;font-size:11px;color:var(--text3);margin-bottom:8px;flex-wrap:wrap;align-items:center;font-family:var(--mono)}
.lsq{width:13px;height:13px;border-radius:3px;display:inline-block;vertical-align:-3px;margin-right:3px;border:1px solid rgba(0,0,0,.1)}
.twrap{display:block;overflow-x:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:var(--rl);max-height:calc(100vh - 310px);background:var(--bg2);box-shadow:var(--sh)}
table{border-collapse:collapse;min-width:100%;font-size:11px;font-family:var(--mono)}
thead th{position:sticky;top:0;background:#f8f9fc;z-index:10;padding:6px 3px;border-bottom:1px solid var(--border2);font-weight:600;text-align:center;white-space:nowrap;color:var(--text2)}
thead th.uc{left:0;z-index:22;text-align:left;padding-left:10px;min-width:140px;font-family:var(--ui);font-size:11px;background:#f8f9fc}
thead th.ic{left:140px;z-index:21;min-width:78px;background:#f8f9fc}
thead th.we{background:#f0f4f8!important;color:var(--text3)}
tbody th.uc{position:sticky;left:0;z-index:6;background:var(--bg2);padding:4px 10px;border-right:1px solid var(--border);font-weight:500;white-space:nowrap;min-width:140px;font-family:var(--ui);font-size:11px;color:var(--text)}
tbody td.ic{position:sticky;left:140px;z-index:5;background:var(--bg2);border-right:1px solid var(--border);padding:3px 4px;min-width:78px;cursor:default}
tbody tr:hover th.uc,tbody tr:hover td.ic{background:#eff3ff}
.info-hidden thead th.ic{min-width:24px!important;width:24px!important;padding:0!important;overflow:hidden}
.info-hidden tbody td.ic{min-width:24px!important;width:24px!important;padding:0!important;overflow:hidden}
.info-hidden tbody td.ic .mrow{display:none}
.ic-toggle{cursor:pointer;font-size:11px;user-select:none;padding:2px 4px;border-radius:3px;background:var(--bg3);border:1px solid var(--border2);line-height:1;white-space:nowrap}
.ic-toggle:hover{background:var(--border2)}
tbody tr.myrow th.uc{color:var(--accent);font-weight:700}
tbody tr.myrow td,tbody tr.myrow th.uc,tbody tr.myrow td.ic{background:#eff6ff!important}
tbody tr.myrow{outline:1px solid #bfdbfe}
td{border:1px solid var(--border);text-align:center;cursor:default;min-width:46px;vertical-align:middle}
.dhdr-num{display:block;font-size:11px;font-weight:700;color:var(--text);line-height:1.2}
.dhdr-date{display:block;font-size:9px;color:var(--text3);font-family:var(--ui);white-space:nowrap;line-height:1.2}
thead th.we .dhdr-num,thead th.we .dhdr-date{color:var(--text3)}
.cell-shift{display:block;font-size:11px;font-weight:700;line-height:1.3}
.cell-date{display:block;font-size:9px;font-family:var(--ui);opacity:.75;line-height:1.2;white-space:nowrap}
.badge{display:inline-block;font-size:9px;font-family:var(--mono);padding:1px 5px;border-radius:4px;font-weight:500;white-space:nowrap}
.bsec{background:var(--sbg);color:var(--st);border:1px solid var(--sb)}
.bsta{background:var(--stbg);color:var(--stt);border:1px solid var(--stb)}
.buni{background:var(--ubg);color:var(--ut);border:1px solid var(--ub)}
.bnat{background:#fdf2f8;color:#86198f;border:1px solid #f0abfc}
.mrow{display:flex;gap:2px;flex-wrap:wrap}
/* manual-shift override outline */
td.is-manual{outline:2px solid #f59e0b!important;outline-offset:-2px}
.nodata{display:none;text-align:center;padding:60px 20px;color:var(--text3);font-family:var(--mono);font-size:13px}
.nodata.show{display:block}
.nodata .ico{font-size:40px;margin-bottom:14px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg3)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
.sw{position:relative;display:flex;align-items:center}
.sw input{padding-left:26px}
.si{position:absolute;left:8px;color:var(--text3);font-size:12px;pointer-events:none}
/* pending pill */
.pending-pill{display:inline-block;font-size:8px;font-family:var(--mono);padding:1px 4px;border-radius:3px;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;vertical-align:1px;margin-left:2px}
@media(max-width:640px){
  header{padding:8px 12px;gap:6px}.logo{font-size:13px}.sub{display:none}.hright{gap:5px}.rbadge{display:none}
  main{padding:8px 10px}.toolbar{gap:5px;padding:8px}
  .toolbar label,.toolbar select,.toolbar input{font-size:12px}
  .toolbar select{max-width:calc(50% - 4px);flex:1 1 calc(50% - 4px)}
  .stats{gap:4px}.stat{padding:2px 7px}.slbl{font-size:9px}.sval{font-size:12px}
  .legend{font-size:10px;gap:6px}.mybanner{font-size:11px;padding:6px 10px}
  td{min-width:38px}.cell-shift{font-size:10px}.cell-date{font-size:8px}
  thead th{min-width:38px}.dhdr-num{font-size:10px}.dhdr-date{font-size:8px}
  .uc{min-width:110px;max-width:110px;font-size:11px}.ic{min-width:60px;font-size:10px}
  .twrap{max-height:calc(100vh - 240px)}.ccard{padding:10px}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">UNFICYP UNPOL ROSTER MANAGER</div>
    <div class="sub" id="subLabel">SharePoint · 56-day shift planner</div>
  </div>
  <div class="hright">
    <div class="upd"><span class="udot"></span><span id="updlbl">Loading…</span></div>
    <button class="btn sm acc" onclick="loadAll()">↻ Refresh</button>
    <span class="rbadge">VIEW ONLY</span>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="sw"><span class="si">🔍</span><input type="text" id="srch" placeholder="Search IPO…" style="width:130px" oninput="buildBody()"></div>
    <select id="fSec" onchange="cascadeFilters();buildBody()"><option value="">All sectors</option></select>
    <select id="fSta" onchange="cascadeFilters();buildBody()"><option value="">All stations</option></select>
    <select id="fUni" onchange="buildBody()"><option value="">All units</option></select>
    <select id="fNat" onchange="buildBody()"><option value="">All nationalities</option></select>
    <select id="fShift" onchange="buildBody()"><option value="">All shifts</option></select>
    <label style="margin-left:auto">My name:
      <input type="text" id="myname" placeholder="Type your name…" style="width:155px" oninput="buildBody()">
    </label>
  </div>

  <div class="mybanner" id="mybanner"></div>
  <div class="legend" id="shiftLegend"></div>
  <div class="stats" id="statsBar"></div>

  <div class="nodata show" id="nodata">
    <div class="ico">📋</div>
    <strong>Loading roster…</strong>
  </div>

  <div class="twrap" id="twrap" style="display:none">
    <table><thead id="rHead"></thead><tbody id="rBody"></tbody></table>
  </div>

  <div class="ccard" style="margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px">
    <span style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap">📤 Export</span>
    <label style="font-size:11px;color:var(--text2);display:flex;align-items:center;gap:5px">From <input type="date" id="exportFrom" style="font-size:11px;padding:4px 6px;border-color:#c7d2fe"></label>
    <label style="font-size:11px;color:var(--text2);display:flex;align-items:center;gap:5px">To <input type="date" id="exportTo" style="font-size:11px;padding:4px 6px;border-color:#c7d2fe"></label>
    <button class="btn sm acc" onclick="exportCSV()">⬇ CSV</button>
    <button class="btn sm acc" onclick="exportImage()">🖼 PNG</button>
    <span id="exportRangeInfo" style="font-size:10px;color:var(--text3);font-family:var(--mono)"></span>
  </div>
</main>

<script>
/* ═══════════════════════════════════════════════════
   SHAREPOINT CONFIG  — hardwired to your environment
   ═══════════════════════════════════════════════════ */
const SP = {
  site:          'https://unitednations.sharepoint.com/sites/UNFICYPUNPOLPRAKSYS',
  personnelList: 'UNFICYP UNPOL Personnel',
  leaveList:     'Leave Requests',
  rosterLib:     'RosterData',
  rosterFile:    'roster-shifts.json',
  // Personnel columns
  col: {
    name:        'Full_x0020_Name',
    sector:      'Sector',
    station:     'Station',
    unit:        'Unit',
    nationality: 'Nationality',
  },
  // Leave request columns
  leave: {
    ipoName:   'IPO_x0020_Name',
    dayType:   'Day_x0020_Type',
    startDate: 'Start_x0020_Date',
    endDate:   'End_x0020_Date',
    status:    'Request_x0020_Approval_x0020_Sta',
  },
};

/* ═══════════════════════════════════════════════════
   LEAVE TYPE → SHIFT KEY MAPPING
   Maps the Day_x0020_Type values from the Leave list
   to the shift keys used in the roster grid.
   ═══════════════════════════════════════════════════ */
const LEAVE_TYPE_MAP = {
  'ALO': { key:'ALO', label:'ALO', name:'Annual Leave (On Cyprus)',  bg:'#fce7f3', fg:'#9d174d', border:'#f9a8d4' },
  'ALI': { key:'ALI', label:'ALI', name:'Annual Leave (Off Cyprus)', bg:'#f5d0fe', fg:'#7e22ce', border:'#e879f9' },
  'RDO': { key:'RDO', label:'RDO', name:'Rest Day (On Cyprus)',      bg:'#fef9c3', fg:'#854d0e', border:'#fde047' },
  'RDI': { key:'RDI', label:'RDI', name:'Rest Day (Off Cyprus)',     bg:'#fef08a', fg:'#713f12', border:'#facc15' },
  'SLO': { key:'SLO', label:'SLO', name:'Sick Leave (On Cyprus)',    bg:'#fee2e2', fg:'#991b1b', border:'#fca5a5' },
  'SLI': { key:'SLI', label:'SLI', name:'Sick Leave (Off Cyprus)',   bg:'#fecaca', fg:'#7f1d1d', border:'#f87171' },
};

/* ═══════════════════════════════════════════════════
   RUNTIME STATE
   ═══════════════════════════════════════════════════ */
const DAYS = 56;
const OFF_DEF = {key:'OFF',label:'',name:'Off / Clear',bg:'#f8fafc',fg:'#94a3b8',border:'#e2e8f0'};

// Base working shifts (non-leave) — these come from roster-shifts.json
let shiftDefs = [
  {key:'D',  label:'D',  name:'Day',       bg:'#dbeafe',fg:'#1e40af',border:'#93c5fd'},
  {key:'A',  label:'A',  name:'Afternoon', bg:'#dcfce7',fg:'#166534',border:'#86efac'},
  {key:'N',  label:'N',  name:'Night',     bg:'#ede9fe',fg:'#5b21b6',border:'#c4b5fd'},
];

let users      = [];   // [{id, name, sector, station, unit, nationality}]
let roster     = {};   // {userId: [key x 56]}  — from roster-shifts.json (working shifts)
let leaveMap   = {};   // {userId: {dayIndex: {key, label, status}}}  — from SP Leave list
let sectors=[], stations=[], units=[];
let startDate  = new Date();
let infoVisible = false;

/* ═══════════════════════════════════════════════════
   SP REST HELPERS
   ═══════════════════════════════════════════════════ */
function spUrl(list, select, filter='', top=5000){
  const params = new URLSearchParams({'$select': select, '$top': String(top)});
  if(filter) params.set('$filter', filter);
  return `${SP.site}/_api/web/lists/getbytitle('${encodeURIComponent(list)}')/items?${params}`;
}

async function spGet(list, select, filter=''){
  const r = await fetch(spUrl(list, select, filter), {
    headers:{'Accept':'application/json;odata=verbose'},
    credentials:'include'
  });
  if(!r.ok) throw new Error(`"${list}" HTTP ${r.status}`);
  const j = await r.json();
  return j.d?.results ?? j.value ?? [];
}

async function spGetFile(lib, file){
  const url = `${SP.site}/_api/web/GetFolderByServerRelativeUrl('${encodeURIComponent(lib)}')/Files('${encodeURIComponent(file)}')/$value`;
  const r = await fetch(url, {headers:{'Accept':'application/json'}, credentials:'include'});
  if(r.status === 404) return null;
  if(!r.ok) throw new Error(`File "${file}" HTTP ${r.status}`);
  return r.text();
}

/* ═══════════════════════════════════════════════════
   DATA LOADING
   ═══════════════════════════════════════════════════ */
async function loadAll(){
  document.getElementById('updlbl').textContent = 'Loading…';
  document.getElementById('nodata').classList.add('show');
  document.getElementById('twrap').style.display = 'none';
  try {
    await Promise.all([loadPersonnel(), loadRosterJSON(), loadLeaveRequests()]);
    populateSelects();
    buildShiftUI();
    buildHead();
    buildBody();
    initExportRange();
    document.getElementById('nodata').classList.remove('show');
    document.getElementById('twrap').style.display = '';
    const now = new Date();
    document.getElementById('updlbl').textContent =
      'Updated ' + now.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) +
      ' ' + now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  } catch(e){
    document.getElementById('updlbl').textContent = '⚠ ' + e.message;
    document.getElementById('nodata').innerHTML =
      `<div class="ico">⚠️</div><strong>Load failed.</strong><br><br>${esc(e.message)}<br><br>`+
      `Ensure this page is hosted within SharePoint and the lists/library exist.`;
    console.error(e);
  }
}

async function loadPersonnel(){
  const c = SP.col;
  const fields = `Id,${c.name},${c.sector},${c.station},${c.unit},${c.nationality}`;
  const items = await spGet(SP.personnelList, fields);
  users = items.map(i => ({
    id:          'u' + i.Id,
    name:        i[c.name]        || '',
    sector:      i[c.sector]      || '',
    station:     i[c.station]     || '',
    unit:        i[c.unit]        || '',
    nationality: i[c.nationality] || '',
  })).filter(u => u.name);
  sectors  = [...new Set(users.map(u=>u.sector).filter(Boolean))].sort();
  stations = [...new Set(users.map(u=>u.station).filter(Boolean))].sort();
  units    = [...new Set(users.map(u=>u.unit).filter(Boolean))].sort();
}

async function loadRosterJSON(){
  // roster-shifts.json stores working shifts (D/A/N/etc.) set by the admin
  // Format: { version, startDate, shiftDefs, roster: {userId: [key x 56]} }
  const text = await spGetFile(SP.rosterLib, SP.rosterFile);
  if(!text){
    // No file yet — initialize empty
    roster = {};
    users.forEach(u => { roster[u.id] = Array(DAYS).fill('OFF'); });
    return;
  }
  const data = JSON.parse(text);
  if(data.startDate) startDate = new Date(data.startDate);
  if(data.shiftDefs && data.shiftDefs.length) shiftDefs = data.shiftDefs;
  roster = data.roster || {};
  // Ensure every user has a row
  users.forEach(u => { if(!roster[u.id]) roster[u.id] = Array(DAYS).fill('OFF'); });
}

async function loadLeaveRequests(){
  // Only load Approved (+ Pending shown differently) leave within the roster window
  const c = SP.leave;
  const fields = `${c.ipoName},${c.dayType},${c.startDate},${c.endDate},${c.status}`;
  // Filter: only Approved or Pending, date range overlapping our window
  const windowEnd = new Date(startDate); windowEnd.setDate(windowEnd.getDate() + DAYS - 1);
  const fmt = d => d.toISOString().slice(0,10) + 'T00:00:00Z';
  const filter = `${c.status} ne 'Rejected' and ${c.endDate} ge datetime'${fmt(startDate)}' and ${c.startDate} le datetime'${fmt(windowEnd)}'`;

  let items = [];
  try { items = await spGet(SP.leaveList, fields, filter); }
  catch(e){ console.warn('Leave list error:', e.message); }

  leaveMap = {};
  const base = new Date(startDate); base.setHours(0,0,0,0);

  items.forEach(item => {
    const ipoName  = item[c.ipoName]  || '';
    const dayType  = (item[c.dayType] || '').trim();
    const status   = item[c.status]   || '';
    const start    = new Date(item[c.startDate]); start.setHours(0,0,0,0);
    const end      = new Date(item[c.endDate]);   end.setHours(0,0,0,0);

    // Match leave to a user by name (case-insensitive)
    const user = users.find(u => u.name.toLowerCase() === ipoName.toLowerCase());
    if(!user) return;

    const typeDef = LEAVE_TYPE_MAP[dayType];
    if(!typeDef) return;

    // Iterate over every day in this leave request
    for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
      const diff = Math.round((d - base) / 86400000);
      if(diff < 0 || diff >= DAYS) continue;
      if(!leaveMap[user.id]) leaveMap[user.id] = {};
      leaveMap[user.id][diff] = { ...typeDef, status };
    }
  });
}

/* ═══════════════════════════════════════════════════
   EFFECTIVE SHIFT FOR A USER/DAY
   Priority: leave (Approved) > manual roster > OFF
   Pending leave shown with a small pill indicator.
   ═══════════════════════════════════════════════════ */
function getCell(userId, dayIndex){
  const leave = leaveMap[userId]?.[dayIndex];
  if(leave){
    if(leave.status === 'Approved') return { key:leave.key, label:leave.label, name:leave.name, bg:leave.bg, fg:leave.fg, border:leave.border, source:'leave-approved' };
    if(leave.status === 'Pending')  return { key:leave.key, label:leave.label, name:leave.name, bg:leave.bg, fg:leave.fg, border:leave.border, source:'leave-pending' };
  }
  const rKey = roster[userId]?.[dayIndex] || 'OFF';
  const def = shiftDefs.find(s=>s.key===rKey) || OFF_DEF;
  return { ...def, source:'roster' };
}

/* ═══════════════════════════════════════════════════
   SHIFT STYLE LOOKUPS
   ═══════════════════════════════════════════════════ */
function rebuildShiftLookups(){
  const allDefs = [...shiftDefs, ...Object.values(LEAVE_TYPE_MAP), OFF_DEF];
  let el = document.getElementById('vShiftStyles');
  if(!el){el=document.createElement('style');el.id='vShiftStyles';document.head.appendChild(el);}
  el.textContent = allDefs.map(s=>`
    td.sc_${s.key}{background:${s.bg};color:${s.fg};font-weight:600}
    td.sc_${s.key}.we{background:${s.bg}cc!important}
  `).join('') + `td.sc_OFF{background:${OFF_DEF.bg};color:${OFF_DEF.fg};font-weight:400}`;
}
rebuildShiftLookups();

/* ═══════════════════════════════════════════════════
   UI BUILD
   ═══════════════════════════════════════════════════ */
function buildShiftUI(){
  rebuildShiftLookups();
  // Shift filter — working shifts + leave types
  const fShift = document.getElementById('fShift');
  if(fShift){
    const cur = fShift.value;
    fShift.innerHTML = '<option value="">All shifts</option>'
      + shiftDefs.map(s=>`<option value="${esc(s.key)}">${esc(s.label)} — ${esc(s.name)}</option>`).join('')
      + '<optgroup label="Leave / Days off">'
      + Object.values(LEAVE_TYPE_MAP).map(s=>`<option value="${esc(s.key)}">${esc(s.label)} — ${esc(s.name)}</option>`).join('')
      + '</optgroup>';
    fShift.value = cur;
  }
  // Legend
  const leg = document.getElementById('shiftLegend');
  if(leg) leg.innerHTML =
    shiftDefs.map(s=>`<span><span class="lsq" style="background:${s.bg};border-color:${s.border}"></span>${esc(s.label)} ${esc(s.name)}</span>`).join('')
    + Object.values(LEAVE_TYPE_MAP).map(s=>`<span><span class="lsq" style="background:${s.bg};border-color:${s.border}"></span>${esc(s.label)} ${esc(s.name)}</span>`).join('')
    + `<span style="margin-left:auto;font-size:10px;color:var(--text3)">🟡 outline = pending leave</span>`;
  // Stats bar
  const sb = document.getElementById('statsBar');
  if(sb) sb.innerHTML =
    `<div class="stat"><span class="slbl">IPOs</span><span class="sval" id="su">—</span></div>`
    + shiftDefs.map(s=>`<div class="stat" style="border-color:${s.border}"><span class="slbl">${esc(s.label)}</span><span class="sval" id="stat_${s.key}" style="color:${s.fg}">—</span></div>`).join('')
    + Object.values(LEAVE_TYPE_MAP).map(s=>`<div class="stat" style="border-color:${s.border}"><span class="slbl">${esc(s.label)}</span><span class="sval" id="stat_${s.key}" style="color:${s.fg}">—</span></div>`).join('');
}

function populateSelects(){
  const fSec = document.getElementById('fSec');
  if(fSec){
    const cur = fSec.value;
    fSec.innerHTML = '<option value="">All sectors</option>'
      + sectors.map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(v)}</option>`).join('');
  }
  cascadeFilters();
  const fNat = document.getElementById('fNat');
  if(fNat){
    const cur = fNat.value;
    const usedNats = [...new Set(users.map(u=>u.nationality).filter(Boolean))].sort();
    fNat.innerHTML = `<option value="">All nationalities${usedNats.length?` (${usedNats.length})`:''}</option>`
      + usedNats.map(n=>`<option value="${esc(n)}"${n===cur?' selected':''}>${esc(n)}</option>`).join('');
  }
}

function cascadeFilters(){
  const selSec = document.getElementById('fSec')?.value||'';
  const selSta = document.getElementById('fSta')?.value||'';
  const availStas = [...new Set(users.filter(u=>!selSec||u.sector===selSec).map(u=>u.station).filter(Boolean))].sort();
  const staEl = document.getElementById('fSta');
  if(staEl){
    const cur = availStas.includes(staEl.value)?staEl.value:'';
    staEl.innerHTML = '<option value="">All stations</option>' + availStas.map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(v)}</option>`).join('');
  }
  const availUnits = [...new Set(users.filter(u=>(!selSec||u.sector===selSec)&&(!selSta||u.station===selSta)).map(u=>u.unit).filter(Boolean))].sort();
  const uniEl = document.getElementById('fUni');
  if(uniEl){
    const cur2 = availUnits.includes(uniEl.value)?uniEl.value:'';
    uniEl.innerHTML = '<option value="">All units</option>' + availUnits.map(v=>`<option value="${esc(v)}"${v===cur2?' selected':''}>${esc(v)}</option>`).join('');
  }
}

function buildHead(){
  const base = new Date(startDate);
  const label = infoVisible ? 'Info ◀' : '▶';
  document.querySelector('.twrap')?.classList.toggle('info-hidden',!infoVisible);
  let h = '<tr><th class="uc">IPO</th>'
    + `<th class="ic" style="position:sticky;left:140px;z-index:21;background:#f8f9fc;min-width:${infoVisible?78:24}px;text-align:center">`
    + `<span class="ic-toggle" onclick="toggleInfo()" title="${infoVisible?'Hide':'Show'} info">${label}</span></th>`;
  for(let i=0;i<DAYS;i++){
    const d=new Date(base); d.setDate(base.getDate()+i);
    const we=d.getDay()===0||d.getDay()===6;
    const ds=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
    h+=`<th class="${we?'we':''}" title="${ds}"><span class="dhdr-num">${i+1}</span><span class="dhdr-date">${ds}</span></th>`;
  }
  document.getElementById('rHead').innerHTML = h + '</tr>';
}

function toggleInfo(){ infoVisible=!infoVisible; document.querySelector('.twrap')?.classList.toggle('info-hidden',!infoVisible); buildHead(); }

function filtered(){
  const s    = document.getElementById('srch').value.toLowerCase();
  const fsc  = document.getElementById('fSec').value;
  const fst  = document.getElementById('fSta').value;
  const fun  = document.getElementById('fUni').value;
  const fnat = document.getElementById('fNat').value;
  const fsh  = document.getElementById('fShift').value;
  return users.filter(u=>{
    if(s   && !u.name.toLowerCase().includes(s)) return false;
    if(fsc && u.sector      !== fsc)             return false;
    if(fst && u.station     !== fst)             return false;
    if(fun && u.unit        !== fun)             return false;
    if(fnat&& u.nationality !== fnat)            return false;
    if(fsh){
      let found = false;
      for(let i=0;i<DAYS;i++){ if(getCell(u.id,i).key===fsh){found=true;break;} }
      if(!found) return false;
    }
    return true;
  });
}

function buildBody(){
  const base   = new Date(startDate);
  const myname = document.getElementById('myname').value.trim().toLowerCase();
  const list   = filtered();
  let h = '';
  list.forEach(u=>{
    const isMe = myname && u.name.toLowerCase().includes(myname);
    h += `<tr${isMe?' class="myrow"':''}>`
      + `<th class="uc">${esc(u.name)}</th>`
      + `<td class="ic"><div class="mrow">`
      + (u.nationality?`<span class="badge bnat">🌐 ${esc(u.nationality)}</span>`:'')
      + (u.sector     ?`<span class="badge bsec">${esc(u.sector)}</span>`:'')
      + (u.station    ?`<span class="badge bsta">${esc(u.station)}</span>`:'')
      + (u.unit       ?`<span class="badge buni">${esc(u.unit)}</span>`:'')
      + `</div></td>`;
    for(let i=0;i<DAYS;i++){
      const d  = new Date(base); d.setDate(base.getDate()+i);
      const we = d.getDay()===0||d.getDay()===6;
      const ds = d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
      const cell = getCell(u.id, i);
      const isPending = cell.source === 'leave-pending';
      const cls = `sc_${cell.key}` + (we?' we':'') + (isPending?' is-manual':'');
      const tip = esc(cell.name) + (isPending?' — PENDING approval':'') + (cell.source==='leave-approved'?' — Approved leave':'');
      h += `<td class="${cls}" title="${tip}">`
        + (cell.label ? `<span class="cell-shift">${esc(cell.label)}</span>` : '')
        + `<span class="cell-date">${ds}${isPending?'<span class="pending-pill">⏳</span>':''}</span>`
        + `</td>`;
    }
    h += '</tr>';
  });
  document.getElementById('rBody').innerHTML = h;
  updateStats(list);
  updateMyBanner(myname);
}

function updateStats(list){
  const allKeys = [...shiftDefs.map(s=>s.key), ...Object.keys(LEAVE_TYPE_MAP)];
  const counts = Object.fromEntries(allKeys.map(k=>[k,0]));
  (list||filtered()).forEach(u=>{
    for(let i=0;i<DAYS;i++){
      const k = getCell(u.id,i).key;
      if(counts[k]!==undefined) counts[k]++;
    }
  });
  const suEl = document.getElementById('su'); if(suEl) suEl.textContent=(list||filtered()).length;
  allKeys.forEach(k=>{ const el=document.getElementById('stat_'+k); if(el) el.textContent=counts[k]||0; });
}

function updateMyBanner(myname){
  const banner = document.getElementById('mybanner');
  if(!myname){ banner.className='mybanner'; return; }
  const me = users.find(u=>u.name.toLowerCase().includes(myname));
  if(!me){ banner.className='mybanner'; return; }
  const today = new Date(); today.setHours(0,0,0,0);
  const base  = new Date(startDate);
  const counts = {};
  [...shiftDefs, ...Object.values(LEAVE_TYPE_MAP)].forEach(s=>{ counts[s.key]=0; });
  let next = null;
  for(let i=0;i<DAYS;i++){
    const d = new Date(base); d.setDate(base.getDate()+i);
    const cell = getCell(me.id, i);
    if(counts[cell.key]!==undefined) counts[cell.key]++;
    if(!next && d>=today && cell.key!=='OFF' && cell.source!=='leave-approved'){
      next = {date:d, name:cell.name};
    }
  }
  const nxt = next
    ? `Next: <strong>${esc(next.name)}</strong> on <strong>${next.date.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'})}</strong> &nbsp;·&nbsp;`
    : 'No upcoming working shifts &nbsp;·&nbsp;';
  const countStr = shiftDefs.map(s=>`${esc(s.label)}:<strong>${counts[s.key]}</strong>`).join(' ');
  banner.innerHTML = `👤 <strong>${esc(me.name)}</strong> &nbsp;·&nbsp; ${nxt}${countStr}`;
  banner.className = 'mybanner show';
}

/* ═══════════════════════════════════════════════════
   EXPORT
   ═══════════════════════════════════════════════════ */
function getExportRange(){
  const base = new Date(startDate);
  const allDates = Array.from({length:DAYS},(_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);return d;});
  let from = new Date(document.getElementById('exportFrom').value||allDates[0]);
  let to   = new Date(document.getElementById('exportTo').value||allDates[DAYS-1]);
  if(from<allDates[0]) from=allDates[0]; if(to>allDates[DAYS-1]) to=allDates[DAYS-1]; if(from>to){from=allDates[0];to=allDates[DAYS-1];}
  const dayIndices=[], dates=[];
  allDates.forEach((d,i)=>{const dd=new Date(d);dd.setHours(0,0,0,0);const f=new Date(from);f.setHours(0,0,0,0);const t=new Date(to);t.setHours(0,0,0,0);if(dd>=f&&dd<=t){dayIndices.push(i);dates.push(d);}});
  const fmt=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  const el=document.getElementById('exportRangeInfo');
  if(el) el.textContent=dates.length+' days ('+fmt(from)+' → '+fmt(to)+')';
  return{dayIndices,dates,fromStr:fmt(from),toStr:fmt(to)};
}
function initExportRange(){
  const base=new Date(startDate); const last=new Date(base); last.setDate(base.getDate()+DAYS-1);
  const fmt=d=>d.toISOString().slice(0,10);
  document.getElementById('exportFrom').value=fmt(base); document.getElementById('exportTo').value=fmt(last);
  const el=document.getElementById('exportRangeInfo');
  const f=base.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  const t=last.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  if(el) el.textContent=DAYS+' days ('+f+' → '+t+')';
}
function exportCSV(){
  const list=filtered(); if(!list.length){alert('No users match filters.');return;}
  const{dayIndices,dates,fromStr,toStr}=getExportRange();
  let csv='Name,Nationality,Sector,Station,Unit';
  dayIndices.forEach((di,p)=>{csv+=',Day '+(di+1)+' ('+dates[p].toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+')';});
  csv+='\n';
  list.forEach(u=>{
    csv+=`"${u.name}","${u.nationality}","${u.sector}","${u.station}","${u.unit}"`;
    dayIndices.forEach(di=>{const c=getCell(u.id,di);csv+=','+(c.key==='OFF'?'Off':c.label);});
    csv+='\n';
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download='roster_'+fromStr.replace(/\s/g,'')+'-'+toStr.replace(/\s/g,'')+'.csv'; a.click();
}
function exportImage(){
  const list=filtered(); if(!list.length){alert('No users match filters.');return;}
  const{dayIndices,dates}=getExportRange();
  const SCALE=2,ROW_H=28,HEAD_H=44,NAME_W=160,DAY_W=46,TITLE_H=36,LEGEND_H=26;
  const totalW=NAME_W+DAY_W*dayIndices.length,totalH=TITLE_H+LEGEND_H+HEAD_H+ROW_H*list.length+2;
  const canvas=document.createElement('canvas'); canvas.width=totalW*SCALE; canvas.height=totalH*SCALE;
  const ctx=canvas.getContext('2d'); ctx.scale(SCALE,SCALE);
  const BORDER='#dde2ec',TEXT='#1a1f36',TEXT2='#4a5170',TEXT3='#8890aa',WE='#f1f5f9',ACC='#3b5bdb';
  const fill=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
  const hline=(y,x1=0,x2=totalW)=>{ctx.strokeStyle=BORDER;ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(x1,y-.25);ctx.lineTo(x2,y-.25);ctx.stroke();};
  const vline=(x,y1=0,y2=totalH)=>{ctx.strokeStyle=BORDER;ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(x-.25,y1);ctx.lineTo(x-.25,y2);ctx.stroke();};
  const txt=(s,x,y,{font='12px Inter,sans-serif',color=TEXT,align='left',maxW}={})=>{ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';maxW?ctx.fillText(s,x,y,maxW):ctx.fillText(s,x,y);};
  fill(0,0,totalW,TITLE_H,ACC);
  txt('UNFICYP UNPOL ROSTER — '+new Date(startDate).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' · '+list.length+' IPOs',12,TITLE_H/2,{font:'bold 12px Inter,sans-serif',color:'#fff'});
  fill(0,TITLE_H,totalW,LEGEND_H,'#eef1f6'); hline(TITLE_H+LEGEND_H);
  let lx=10;
  [...shiftDefs,...Object.values(LEAVE_TYPE_MAP)].forEach(s=>{
    fill(lx,TITLE_H+7,12,12,s.bg); ctx.strokeStyle=s.border;ctx.lineWidth=.5;ctx.strokeRect(lx+.25,TITLE_H+7.25,11.5,11.5);
    txt(s.label,lx+16,TITLE_H+LEGEND_H/2,{font:'10px Inter,sans-serif',color:TEXT2}); lx+=ctx.measureText(s.label).width+22;
  });
  const hy=TITLE_H+LEGEND_H; fill(0,hy,totalW,HEAD_H,'#f8f9fc'); hline(hy+HEAD_H);
  txt('IPO',6,hy+HEAD_H/2,{font:'bold 11px Inter,sans-serif',color:TEXT2});
  dayIndices.forEach((di,pos)=>{
    const d=dates[pos],isWe=d.getDay()===0||d.getDay()===6,cx=NAME_W+pos*DAY_W;
    if(isWe) fill(cx,hy,DAY_W,HEAD_H,WE);
    txt(String(di+1),cx+DAY_W/2,hy+11,{font:'bold 10px Inter',color:isWe?TEXT3:TEXT2,align:'center'});
    txt(d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}),cx+DAY_W/2,hy+27,{font:'9px Inter',color:TEXT3,align:'center'});
    vline(cx,hy,hy+HEAD_H);
  }); vline(NAME_W,hy,hy+HEAD_H);
  list.forEach((u,ri)=>{
    const ry=TITLE_H+LEGEND_H+HEAD_H+ri*ROW_H,rowBg=ri%2===0?'#fff':'#f7f9fc';
    fill(0,ry,totalW,ROW_H,rowBg);
    txt(u.name,6,ry+ROW_H/2,{font:'500 11px Inter',color:TEXT,maxW:NAME_W-8});
    dayIndices.forEach((di,pos)=>{
      const d=dates[pos],isWe=d.getDay()===0||d.getDay()===6,cx=NAME_W+pos*DAY_W;
      const cell=getCell(u.id,di);
      fill(cx,ry,DAY_W,ROW_H,isWe&&cell.key==='OFF'?WE:cell.bg||rowBg);
      if(cell.label) txt(cell.label,cx+DAY_W/2,ry+ROW_H/2,{font:'bold 10px "DM Mono",monospace',color:cell.fg||TEXT,align:'center'});
      vline(cx,ry,ry+ROW_H);
    });
    hline(ry+ROW_H); vline(NAME_W,ry,ry+ROW_H);
  });
  const link=document.createElement('a'); link.download='roster.png'; link.href=canvas.toDataURL('image/png'); link.click();
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// Boot
buildShiftUI();
loadAll();
</script>
